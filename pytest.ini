[pytest]
testpaths = tests
# ROS integration tests manage their own subprocesses and executor lifecycle.
# launch_testing imports every module before normal optional-dependency skips.
addopts = -p no:launch_testing -p no:launch_ros
markers =
    browser: offline review UI with Playwright and explicitly supplied test bundle
    ros: full ROS launch, controllers, recording and safety checks
    ml: Native dataset, ACT training and inference integration
    soak: optional sustained full-resolution ROS control and recording test
